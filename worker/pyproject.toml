[project]
name = "parking-worker"
version = "0.1.0"
description = "Queue poller: alignment, scoring, state rules, status writes"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.5.4",
  "parking-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parking_worker"]
