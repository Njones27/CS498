[project]
name = "parking-api"
version = "0.1.0"
description = "FastAPI service: REST endpoints, dev auth, presigned uploads, job creation"
requires-python = ">=3.12"
dependencies = [
  "parking-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parking_api"]
