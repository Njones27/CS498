# ElasticMQ (SQS emulator) for Phase 1. Mirrors the Phase 2 SQS queue + DLQ (HDD §8.1).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

queues {
  parking-jobs {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "parking-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  parking-jobs-dlq {}
}

# Region and account id used in queue URLs: http://elasticmq:9324/000000000000/parking-jobs
aws {
  region = us-east-1
  accountId = 000000000000
}
