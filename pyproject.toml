[project]
name = "parking-availability"
version = "0.1.0"
description = "CS 498 Parking Availability Web App (monorepo root)"
requires-python = ">=3.12"
dependencies = ["parking-core", "parking-api", "parking-worker", "parking-seed"]

[tool.uv]
# The worker uses opencv-python-headless. ultralytics (next PR) requires opencv-python, which
# would install a second, GUI-linked cv2 over the headless build in the same site-packages.
# This override drops that requirement everywhere so only the headless wheel is installed.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.workspace]
members = ["core", "api", "worker", "seed"]

[tool.uv.sources]
parking-core = { workspace = true }
parking-api = { workspace = true }
parking-worker = { workspace = true }
parking-seed = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "httpx>=0.27",
  "pillow>=11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["core", "api", "worker", "seed"]
testpaths = ["core/tests", "api/tests", "worker/tests", "seed/tests", "tests"]
markers = ["compose: needs the Docker Compose stack (RUN_COMPOSE_TESTS=1)"]
addopts = "-m 'not compose'"
