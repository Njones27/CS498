[package]
name = "parking-core-rs"
version = "0.1.0"
edition = "2021"
authors = ["Rylan Moseley <rylanmoseley@users.noreply.github.com>"]
description = "High-throughput, zero-allocation spatial occupancy inference engine for campus parking lots"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
