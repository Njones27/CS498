[project]
name = "parking-seed"
version = "0.1.0"
description = "Seed and calibration CLI: creates local resources and loads a lot"
requires-python = ">=3.12"
dependencies = [
  "parking-core",
  "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parking_seed"]
