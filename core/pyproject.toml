[project]
name = "parking-core"
version = "0.1.0"
description = "Shared domain models, interfaces and adapters for the Parking Availability app"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
  "PyJWT>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parking_core"]
